version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for the sample's toolchain: it is never published,
      # and its updates are noise one at a time.
      react-native-sample:
        patterns: ["expo*", "react-native*", "@expo/*", "metro*"]
  - package-ecosystem: gradle
    directory: /engine/compose
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
