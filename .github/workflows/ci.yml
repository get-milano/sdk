name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  MILANO_SPECS_DIR: ${{ github.workspace }}/.specs
  # The conformance suite release the engines are held to: a tag of
  # get-milano/specs, never its main, so a specs push cannot change what
  # this repository is tested against. Adopting a new suite is a deliberate
  # edit here, reviewed with the engine changes it needs; check-consistency
  # keeps the three workflows and the README on the same release.
  SPECS_RELEASE: "2.1.0"

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: get-milano/specs
          ref: ${{ env.SPECS_RELEASE }}
          path: .specs
      - name: Tests (conformance suite included)
        run: swift test
      - name: The bindings golden compiles against the engine
        run: node scripts/verify-bindings.mjs swift
      - name: watchOS portability (build only)
        run: >
          xcodebuild -scheme milano-sdk
          -destination 'generic/platform=watchOS Simulator' build
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: get-milano/specs
          ref: ${{ env.SPECS_RELEASE }}
          path: .specs
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      # The sample typechecks against the packages' published shape, so the
      # packages are built before anything is checked.
      - name: Build the packages
        run: npm run build
      # The generator's tests in the specs repository pin its output but
      # cannot compile it; this compiles the TypeScript golden, which
      # reaches every descriptor form, against the engine.
      - name: The bindings golden compiles against the engine
        run: node scripts/verify-bindings.mjs typescript
      # `milano schema`, `milano diff`, and `milano bindings` are ports of
      # the specs tools; the Python is the reference, and this runs both
      # over every vocabulary in the checkout and compares the bytes.
      - name: The CLI reproduces the specs tools byte for byte
        run: node scripts/verify-cli-parity.mjs
      # Regenerates the sample's bindings from the vocabulary and compiles
      # them, the way a consumer's build does.
      - name: Types (strict, packages and sample)
        run: npm run typecheck

      - name: The committed bindings match the vocabulary
        run: git diff --exit-code -- samples/react-native/src/bindings.generated.ts

      # Repository-level invariants no single test can see: the three
      # samples shipping identical documents, versions agreeing across
      # VERSION and the manifests, and the packed tarballs actually
      # installing and importing.
      - name: Consistency
        run: node scripts/check-consistency.mjs
      - name: Tests (conformance suite included)
        run: npm test

      # `react: >=18` is a promise, and the workspace installs exactly one
      # React, so every test above runs against that single version. This
      # mounts the packed binding on each supported major in its own
      # project, which is the only place React 18 is ever executed.
      - name: React compatibility (18 and 19)
        run: node scripts/verify-react-compat.mjs

  docs:
    # The guides, built the way Pages builds them. Catches Liquid and theme
    # breakage on the pull request rather than at release, when the same
    # site is rebuilt with the generated API reference dropped in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
      - name: Build the docs site
        working-directory: docs
        run: bundle exec jekyll build --destination ../_site --baseurl /sdk

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: get-milano/specs
          ref: ${{ env.SPECS_RELEASE }}
          path: .specs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # engine/compose/build.gradle.kts stages the generator's Kotlin golden
      # into the JVM test sources; compiling them is the check.
      - name: The bindings golden compiles against the engine
        run: node scripts/verify-bindings.mjs kotlin
      - name: Engine tests and Android library (conformance suite included)
        working-directory: engine/compose
        run: ./gradlew jvmTest assembleAndroidMain

      # The AAR carries the floor it imposes on consumers. AGP derives it
      # from compileSdk unless told otherwise, so a toolchain bump can
      # silently lock out every app on an older compileSdk. This is the
      # only place that would notice.
      - name: The AAR imposes no compileSdk floor
        run: |
          AAR="$(find engine/compose/build/outputs/aar -name '*.aar' | head -1)"
          METADATA="$(unzip -p "$AAR" META-INF/com/android/build/gradle/aar-metadata.properties)"
          echo "$METADATA"
          echo "$METADATA" | grep -qx 'minCompileSdk=1' || {
            echo "the published AAR would demand a compileSdk floor;" \
                 "see aarMetadata in engine/compose/build.gradle.kts" >&2
            exit 1
          }
      # The samples' Gradle tasks run the Milano CLI (bindings, schema,
      # validate) from the workspace build, so the CLI and the engine it
      # validates with are built first; the React binding is not needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the CLI the samples' build steps run
        run: |
          npm ci
          npm run build --workspace engine/ts --workspace cli
      - name: Sample app (source consumption via composite build)
        working-directory: samples/compose
        run: ./gradlew :app:assembleDebug
      - name: Desktop sample app (the engine's JVM target, from source)
        working-directory: samples/compose-desktop
        run: ./gradlew assemble
      - name: ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          PATH="$PWD:$PATH" scripts/lint-kotlin.sh
