name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MILANO_SPECS_DIR: ${{ github.workspace }}/.specs

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: get-milano/specs
          path: .specs
      - name: Tests (conformance suite included)
        run: swift test
      - name: watchOS portability (build only)
        run: >
          xcodebuild -scheme milano-sdk
          -destination 'generic/platform=watchOS Simulator' build
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint --strict

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: get-milano/specs
          path: .specs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Engine tests and Android library (conformance suite included)
        working-directory: engine/compose
        run: ./gradlew jvmTest assembleRelease
      - name: Sample app (source consumption via composite build)
        working-directory: samples/compose
        run: ./gradlew :app:assembleDebug
      - name: ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          ./ktlint "engine/compose/src/**/*.kt" "engine/compose/*.kts" \
                   "samples/compose/app/src/**/*.kt" "samples/compose/*.kts" \
                   "samples/compose/app/*.kts"
