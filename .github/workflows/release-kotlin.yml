name: Release Kotlin

# Manual release of the Compose engine: runs the conformance suite, then
# publishes the full Maven publication (android AAR + JVM JAR + KMP
# metadata) to GitHub Packages and attaches the loose AAR/JAR to the
# GitHub release for manual Gradle consumption. Creates the v<version>
# tag and release if the Swift workflow has not already.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0); the tag becomes v<version>"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      MILANO_SPECS_DIR: ${{ github.workspace }}/.specs
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be semantic (e.g. 0.1.0), got: $VERSION" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: get-milano/specs
          path: .specs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Conformance suite (release gate)
        working-directory: engine/compose
        run: ./gradlew -PmilanoVersion="$VERSION" jvmTest

      - name: Build and publish to GitHub Packages
        working-directory: engine/compose
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew -PmilanoVersion="$VERSION" assembleRelease jvmJar publish

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAR=$(find engine/compose/build/outputs/aar -name "*-release.aar" | head -1)
          JAR=$(find engine/compose/build/libs -name "*jvm-$VERSION.jar" | head -1)
          cp "$AAR" "engine-compose-$VERSION.aar"
          cp "$JAR" "engine-compose-jvm-$VERSION.jar"
          gh release view "v$VERSION" > /dev/null 2>&1 \
            || gh release create "v$VERSION" --title "v$VERSION" \
                 --notes "Milano Compose engine $VERSION." --target "$GITHUB_SHA"
          gh release upload "v$VERSION" \
            "engine-compose-$VERSION.aar" "engine-compose-jvm-$VERSION.jar" --clobber
