name: Release

# Releases every engine under one tag, two ways in:
#
# - Automatically when CI succeeds on main: the version comes from the
#   VERSION file, so merging a release PR (develop -> main, containing the
#   VERSION bump) is the release action; a red CI can never tag. If the tag
#   for the file's version already exists, the run skips gracefully: merges
#   that do not bump VERSION release nothing.
# - Manually (workflow_dispatch) for development builds: run from any
#   branch with an explicit version, normally a prerelease like 0.3.0-rc.1;
#   prerelease versions are marked as such on the GitHub release.
#
# Pipeline, in order, each gating the next: preflight resolves the version
# and checks prerequisites; the kotlin job gates on the conformance suite
# and builds the AAR and JAR, publishing nothing; the typescript job gates
# on the same suite and builds the npm packages, publishing nothing; the
# release job runs the Swift conformance gate, builds and signs the
# XCFramework, rewrites Package.swift to a binaryTarget, stamps versions,
# uploads everything to a draft release and publishes it, which is the
# step that creates the v<version> tag (on the rewritten-manifest commit,
# tag-only, never on main); and only then the maven job publishes to
# GitHub Packages and the npm job stages the packages on npmjs for a
# maintainer to approve.
#
# The documentation site is not part of this pipeline: it is not a
# versioned artifact, and tying it here meant a docs failure could only be
# retried by cutting a new version. It lives in docs.yml, which runs on
# its own and can be dispatched at any time.
#
# Nothing leaves the pipeline until every lane is green: a failing Swift
# lane leaves no tag, no release, and no published package, so a rerun is
# clean. A failed upload leaves no tag and reruns replace the draft; a
# failed Maven or npm publish is recovered by re-running that job alone,
# as is a failed docs deploy: the site is rebuilt from scratch every time,
# so publishing it again is always safe.
# npm publishes are immutable, so the npm job is the one lane a rerun
# cannot repeat: it skips versions already published or already staged. It
# carries no credential: npmjs trusts this workflow by name (trusted
# publishing), so the repository holds no npm token at all. It stages
# rather than publishes, so the packages go public only when a maintainer
# approves them with 2FA.
# See RELEASE-SETUP (private) for secrets.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.3.0-rc.1); defaults to the VERSION file"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  preflight:
    # On the automatic path, run only when CI for that commit succeeded:
    # a red main can never tag a release.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      proceed: ${{ steps.tagcheck.outputs.proceed }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve and validate the version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(cat VERSION | tr -d '[:space:]')}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "version must be semantic with optional prerelease (e.g. 0.1.0 or 0.3.0-rc.1), got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether the tag is free
        id: tagcheck
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "tag v$VERSION already exists; nothing to release." >&2
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets exist
        if: steps.tagcheck.outputs.proceed == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "missing repository secret: $name (see RELEASE-SETUP notes)" >&2
              missing=1
            fi
          done
          exit $missing

      - name: Check certificate decodes and holds an identity
        if: steps.tagcheck.outputs.proceed == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12" \
            || { echo "APPLE_CERTIFICATE_BASE64 is not valid base64" >&2; exit 1; }
          openssl pkcs12 -in "$RUNNER_TEMP/certificate.p12" -passin env:APPLE_CERTIFICATE_PASSWORD \
            -nokeys -legacy 2>/dev/null | grep -q "BEGIN CERTIFICATE" \
            || openssl pkcs12 -in "$RUNNER_TEMP/certificate.p12" -passin env:APPLE_CERTIFICATE_PASSWORD \
                 -nokeys 2>/dev/null | grep -q "BEGIN CERTIFICATE" \
            || { echo "the .p12 does not decrypt with APPLE_CERTIFICATE_PASSWORD (or holds no certificate)" >&2; exit 1; }
          rm -f "$RUNNER_TEMP/certificate.p12"

  kotlin:
    # Builds and gates only: publishing happens after every lane is green,
    # in the maven job below, so a failing Swift lane can never leave a
    # published Maven version behind a release that does not exist.
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      MILANO_SPECS_DIR: ${{ github.workspace }}/.specs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: get-milano/specs
          path: .specs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Stamp the engine version
        run: |
          FILE=engine/compose/src/commonMain/kotlin/dev/getmilano/core/MilanoInfo.kt
          sed -i -E "s/(const val VERSION: String = )\"[^\"]*\"/\1\"$VERSION\"/" "$FILE"
          grep -q "\"$VERSION\"" "$FILE" || { echo "version stamp failed; MilanoInfo.kt changed shape" >&2; exit 1; }

      - name: Conformance suite (release gate)
        working-directory: engine/compose
        run: ./gradlew -PmilanoVersion="$VERSION" jvmTest

      - name: Build the artifacts
        working-directory: engine/compose
        run: ./gradlew -PmilanoVersion="$VERSION" assembleAndroidMain jvmJar

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp "$(find engine/compose/build/outputs/aar -name '*.aar' | head -1)" \
             "release-artifacts/engine-compose-android-$VERSION.aar"
          cp "$(find engine/compose/build/libs -name "*jvm-$VERSION.jar" | head -1)" \
             "release-artifacts/engine-compose-jvm-$VERSION.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-artifacts
          path: release-artifacts/
          retention-days: 1

  typescript:
    # Builds and gates only: the packages are published after every lane is
    # green, in the npm job below, because an npm publish cannot be undone.
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      MILANO_SPECS_DIR: ${{ github.workspace }}/.specs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: get-milano/specs
          path: .specs
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci

      - name: Stamp the package versions
        run: node scripts/stamp-version.mjs "$VERSION"

      - name: Build the packages
        run: npm run build

      - name: Conformance suite (release gate)
        run: npm test

      - name: Types (strict, packages and sample)
        run: npm run typecheck

  release:
    needs: [preflight, kotlin, typescript]
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      MILANO_SPECS_DIR: ${{ github.workspace }}/.specs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: get-milano/specs
          path: .specs

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Stamp the engine version
        run: |
          FILE=engine/swiftui/Sources/MilanoSDK/Core/MilanoInfo.swift
          sed -i '' -E "s/(public static let version = )\"[^\"]*\"/\1\"$VERSION\"/" "$FILE"
          grep -q "\"$VERSION\"" "$FILE" || { echo "version stamp failed; MilanoInfo.swift changed shape" >&2; exit 1; }
          KT=engine/compose/src/commonMain/kotlin/dev/getmilano/core/MilanoInfo.kt
          sed -i '' -E "s/(const val VERSION: String = )\"[^\"]*\"/\1\"$VERSION\"/" "$KT"
          grep -q "\"$VERSION\"" "$KT" || { echo "version stamp failed; MilanoInfo.kt changed shape" >&2; exit 1; }

      - name: Conformance suite (release gate)
        run: swift test

      - name: Generate the framework project
        working-directory: engine/swiftui
        run: |
          brew install tuist
          tuist generate --no-open

      - name: Archive all slices
        working-directory: engine/swiftui
        run: |
          for destination in \
            "generic/platform=iOS" \
            "generic/platform=iOS Simulator" \
            "generic/platform=macOS" \
            "generic/platform=watchOS" \
            "generic/platform=watchOS Simulator"; do
            name="${destination#generic/platform=}"
            name="${name// /-}"
            xcodebuild archive \
              -workspace MilanoSDK.xcworkspace \
              -scheme MilanoSDK \
              -destination "$destination" \
              -archivePath "build/$name.xcarchive" \
              SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
              CODE_SIGNING_ALLOWED=NO | tail -3
          done

      - name: Create and sign the XCFramework
        working-directory: engine/swiftui
        run: |
          args=()
          for archive in build/*.xcarchive; do
            args+=(-framework "$archive/Products/Library/Frameworks/MilanoSDK.framework")
          done
          xcodebuild -create-xcframework "${args[@]}" -output build/MilanoSDK.xcframework
          codesign --timestamp --sign "Apple Distribution" build/MilanoSDK.xcframework
          codesign --verify --verbose build/MilanoSDK.xcframework
          ditto -c -k --sequesterRsrc --keepParent \
            build/MilanoSDK.xcframework "$RUNNER_TEMP/MilanoSDK.xcframework.zip"

      - name: Rewrite Package.swift for the tag
        run: |
          CHECKSUM=$(swift package compute-checksum "$RUNNER_TEMP/MilanoSDK.xcframework.zip")
          cat > Package.swift <<EOF
          // swift-tools-version:6.0
          import PackageDescription

          // Release manifest: this tag resolves to the prebuilt, signed
          // XCFramework attached to the GitHub release. The source package
          // lives on main.
          let package = Package(
              name: "milano-sdk",
              platforms: [
                  .iOS(.v15),
                  .macOS(.v12),
                  .watchOS(.v8)
              ],
              products: [
                  .library(name: "MilanoSDK", targets: ["MilanoSDK"])
              ],
              targets: [
                  .binaryTarget(
                      name: "MilanoSDK",
                      url: "https://github.com/get-milano/sdk/releases/download/v$VERSION/MilanoSDK.xcframework.zip",
                      checksum: "$CHECKSUM"
                  )
              ]
          )
          EOF

      - uses: actions/download-artifact@v4
        with:
          name: kotlin-artifacts
          path: release-artifacts/

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift \
            engine/swiftui/Sources/MilanoSDK/Core/MilanoInfo.swift \
            engine/compose/src/commonMain/kotlin/dev/getmilano/core/MilanoInfo.kt
          git commit -m "Release v$VERSION: binary Package.swift, stamped versions"
          RELEASE_SHA="$(git rev-parse HEAD)"

          # Provenance: the exact specs revision the conformance gate ran
          # against, and the tuist that produced the framework project.
          SPECS_SHA="$(git -C "$MILANO_SPECS_DIR" rev-parse HEAD)"
          TUIST_VERSION="$(tuist version 2>/dev/null || echo unknown)"

          # The release commit must be reachable on the remote for the
          # draft's target; a scratch branch carries it until publish.
          git push origin "HEAD:refs/heads/release-v$VERSION"

          # A stale draft from a failed earlier run is replaced, so reruns
          # are self-recovering (the tag only exists once a draft was
          # published, and then preflight skips).
          gh release delete "v$VERSION" --yes 2>/dev/null || true

          # Draft first: assets upload while no tag exists yet. Publishing
          # is the atomic step that creates the tag at the release commit,
          # so a failed upload can never leave a tag pointing at a release
          # without its binaries.
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "v$VERSION" \
            "$RUNNER_TEMP/MilanoSDK.xcframework.zip" \
            release-artifacts/* \
            "${flags[@]}" \
            --draft \
            --target "$RELEASE_SHA" \
            --title "v$VERSION" \
            --notes "Milano $VERSION. Signed MilanoSDK.xcframework (iOS, iOS Simulator, macOS, watchOS, watchOS Simulator); Compose engine AAR and JVM JAR (also on GitHub Packages as dev.get-milano:engine-compose:$VERSION). SwiftPM: pin \`from: \"$VERSION\"\` to resolve the prebuilt binary. Conformance gate: specs@$SPECS_SHA; built with tuist $TUIST_VERSION."
          gh release edit "v$VERSION" --draft=false

          # The tag now exists at the release commit; the scratch branch
          # has served its purpose.
          git push origin ":refs/heads/release-v$VERSION" || true

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  maven:
    # The last step of a successful release: the tag, the GitHub release,
    # and its assets already exist, so publishing here can only ever be
    # the final missing piece. Re-running just this job (the tag check in
    # preflight is not re-evaluated) recovers a failed publish without
    # touching anything else.
    needs: [preflight, kotlin, release]
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      MILANO_SPECS_DIR: ${{ github.workspace }}/.specs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: get-milano/specs
          path: .specs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Stamp the engine version
        run: |
          FILE=engine/compose/src/commonMain/kotlin/dev/getmilano/core/MilanoInfo.kt
          sed -i -E "s/(const val VERSION: String = )\"[^\"]*\"/\1\"$VERSION\"/" "$FILE"
          grep -q "\"$VERSION\"" "$FILE" || { echo "version stamp failed; MilanoInfo.kt changed shape" >&2; exit 1; }

      - name: Publish to GitHub Packages
        working-directory: engine/compose
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew -PmilanoVersion="$VERSION" publish

  npm:
    # Same position as the maven job: the tag and the GitHub release already
    # exist, so this can only be the final missing piece. npm publishes are
    # immutable and cannot be replaced, so a rerun after a partial failure
    # publishes only the packages not yet on the registry.
    needs: [preflight, kotlin, typescript, release]
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing: npm exchanges this job's OIDC identity for a
      # short-lived credential, so there is no token anywhere, and the
      # provenance attestation is produced automatically. It needs npm
      # 11.5.1 or newer, which is newer than some Node 24 images bundle.
      - name: Ensure an npm that can publish through OIDC
        run: npm install -g npm@latest

      - run: npm ci

      - name: Stamp the package versions
        run: node scripts/stamp-version.mjs "$VERSION"

      - name: Build the packages
        run: npm run build

      # Staged, not published: the trusted publisher authorises
      # `npm stage publish`, which puts the tarball on the registry without
      # making it public. A maintainer then approves it with 2FA, which is
      # the proof-of-presence an automated publish cannot provide.
      #
      # Dependency order: core, then react, so a package is never staged
      # before what it depends on. `npm stage` is unaware of workspaces, so
      # each package is staged from its own directory.
      - name: Stage on npmjs
        run: |
          for directory in engine/ts engine/react; do
            name="$(node -p "require('./$directory/package.json').name")"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping."
              continue
            fi
            if npm stage list "$name" 2>/dev/null | grep -q "$VERSION"; then
              echo "$name@$VERSION is staged already, waiting for approval; skipping."
              continue
            fi
            ( cd "$directory" && npm stage publish )
          done
          echo
          echo 'Staged. Approve them to make them public:'
          echo '  npm stage list'
          echo '  npm stage approve <stage-id>   # prompts for 2FA'
