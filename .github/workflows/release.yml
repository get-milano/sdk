name: Release

# Releases both engines under one tag, two ways in:
#
# - Automatically on push to main: the version comes from the VERSION file,
#   so merging a release PR (develop -> main, containing the VERSION bump)
#   is the release action. If the tag for the file's version already exists,
#   the run skips gracefully: merges that do not bump VERSION release
#   nothing.
# - Manually (workflow_dispatch) for development builds: run from any
#   branch with an explicit version, normally a prerelease like 0.3.0-rc.1;
#   prerelease versions are marked as such on the GitHub release.
#
# Pipeline: preflight resolves the version and checks prerequisites, the
# kotlin job gates on the conformance suite and publishes to GitHub
# Packages, and the release job builds and signs the XCFramework, rewrites
# Package.swift to a binaryTarget, stamps versions, and only then creates
# the v<version> tag (on the rewritten-manifest commit, tag-only, never on
# main) and the GitHub release carrying all artifacts. Nothing is tagged
# unless every build succeeded. See RELEASE-SETUP (private) for secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.3.0-rc.1); defaults to the VERSION file"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      proceed: ${{ steps.tagcheck.outputs.proceed }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate the version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(cat VERSION | tr -d '[:space:]')}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "version must be semantic with optional prerelease (e.g. 0.1.0 or 0.3.0-rc.1), got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether the tag is free
        id: tagcheck
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "tag v$VERSION already exists; nothing to release." >&2
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets exist
        if: steps.tagcheck.outputs.proceed == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "missing repository secret: $name (see RELEASE-SETUP notes)" >&2
              missing=1
            fi
          done
          exit $missing

      - name: Check certificate decodes and holds an identity
        if: steps.tagcheck.outputs.proceed == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12" \
            || { echo "APPLE_CERTIFICATE_BASE64 is not valid base64" >&2; exit 1; }
          openssl pkcs12 -in "$RUNNER_TEMP/certificate.p12" -passin env:APPLE_CERTIFICATE_PASSWORD \
            -nokeys -legacy 2>/dev/null | grep -q "BEGIN CERTIFICATE" \
            || openssl pkcs12 -in "$RUNNER_TEMP/certificate.p12" -passin env:APPLE_CERTIFICATE_PASSWORD \
                 -nokeys 2>/dev/null | grep -q "BEGIN CERTIFICATE" \
            || { echo "the .p12 does not decrypt with APPLE_CERTIFICATE_PASSWORD (or holds no certificate)" >&2; exit 1; }
          rm -f "$RUNNER_TEMP/certificate.p12"

  kotlin:
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      MILANO_SPECS_DIR: ${{ github.workspace }}/.specs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: get-milano/specs
          path: .specs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Stamp the engine version
        run: |
          FILE=engine/compose/src/commonMain/kotlin/dev/getmilano/core/MilanoInfo.kt
          sed -i -E "s/(const val VERSION: String = )\"[^\"]*\"/\1\"$VERSION\"/" "$FILE"
          grep -q "\"$VERSION\"" "$FILE" || { echo "version stamp failed; MilanoInfo.kt changed shape" >&2; exit 1; }

      - name: Conformance suite (release gate)
        working-directory: engine/compose
        run: ./gradlew -PmilanoVersion="$VERSION" jvmTest

      - name: Build and publish to GitHub Packages
        working-directory: engine/compose
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew -PmilanoVersion="$VERSION" assembleRelease jvmJar publish

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp "$(find engine/compose/build/outputs/aar -name '*-release.aar' | head -1)" \
             "release-artifacts/engine-compose-$VERSION.aar"
          cp "$(find engine/compose/build/libs -name "*jvm-$VERSION.jar" | head -1)" \
             "release-artifacts/engine-compose-jvm-$VERSION.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-artifacts
          path: release-artifacts/
          retention-days: 1

  release:
    needs: [preflight, kotlin]
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Stamp the engine version
        run: |
          FILE=engine/swiftui/Sources/MilanoSDK/Core/MilanoInfo.swift
          sed -i '' -E "s/(public static let version = )\"[^\"]*\"/\1\"$VERSION\"/" "$FILE"
          grep -q "\"$VERSION\"" "$FILE" || { echo "version stamp failed; MilanoInfo.swift changed shape" >&2; exit 1; }

      - name: Generate the framework project
        working-directory: engine/swiftui
        run: |
          brew install tuist
          tuist generate --no-open

      - name: Archive all slices
        working-directory: engine/swiftui
        run: |
          for destination in \
            "generic/platform=iOS" \
            "generic/platform=iOS Simulator" \
            "generic/platform=macOS" \
            "generic/platform=watchOS" \
            "generic/platform=watchOS Simulator"; do
            name="${destination#generic/platform=}"
            name="${name// /-}"
            xcodebuild archive \
              -workspace MilanoSDK.xcworkspace \
              -scheme MilanoSDK \
              -destination "$destination" \
              -archivePath "build/$name.xcarchive" \
              SKIP_INSTALL=NO BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
              CODE_SIGNING_ALLOWED=NO | tail -3
          done

      - name: Create and sign the XCFramework
        working-directory: engine/swiftui
        run: |
          args=()
          for archive in build/*.xcarchive; do
            args+=(-framework "$archive/Products/Library/Frameworks/MilanoSDK.framework")
          done
          xcodebuild -create-xcframework "${args[@]}" -output build/MilanoSDK.xcframework
          codesign --timestamp --sign "Apple Distribution" build/MilanoSDK.xcframework
          codesign --verify --verbose build/MilanoSDK.xcframework
          ditto -c -k --sequesterRsrc --keepParent \
            build/MilanoSDK.xcframework "$RUNNER_TEMP/MilanoSDK.xcframework.zip"

      - name: Rewrite Package.swift for the tag
        run: |
          CHECKSUM=$(swift package compute-checksum "$RUNNER_TEMP/MilanoSDK.xcframework.zip")
          cat > Package.swift <<EOF
          // swift-tools-version:6.0
          import PackageDescription

          // Release manifest: this tag resolves to the prebuilt, signed
          // XCFramework attached to the GitHub release. The source package
          // lives on main.
          let package = Package(
              name: "milano-sdk",
              platforms: [
                  .iOS(.v15),
                  .macOS(.v12),
                  .watchOS(.v8)
              ],
              products: [
                  .library(name: "MilanoSDK", targets: ["MilanoSDK"])
              ],
              targets: [
                  .binaryTarget(
                      name: "MilanoSDK",
                      url: "https://github.com/get-milano/sdk/releases/download/v$VERSION/MilanoSDK.xcframework.zip",
                      checksum: "$CHECKSUM"
                  )
              ]
          )
          EOF

      - uses: actions/download-artifact@v4
        with:
          name: kotlin-artifacts
          path: release-artifacts/

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift engine/swiftui/Sources/MilanoSDK/Core/MilanoInfo.swift
          git commit -m "Release v$VERSION: binary Package.swift, stamped version"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "v$VERSION" \
            "$RUNNER_TEMP/MilanoSDK.xcframework.zip" \
            release-artifacts/* \
            "${flags[@]}" \
            --title "v$VERSION" \
            --notes "Milano $VERSION. Signed MilanoSDK.xcframework (iOS, iOS Simulator, macOS, watchOS, watchOS Simulator); Compose engine AAR and JVM JAR (also on GitHub Packages as dev.get-milano:engine-compose:$VERSION). SwiftPM: pin \`from: \"$VERSION\"\` to resolve the prebuilt binary."

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
