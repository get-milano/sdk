android.useAndroidX=true
# Dokka 2 task and configuration model; V1 is deprecated.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
# Same reason as the sample: AGP 9 and Dokka both want more than Gradle's
# default heap, and the release lane builds the AAR and the API reference
# in one run.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
